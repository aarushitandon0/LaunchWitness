[project]
name = "launchwitness"
version = "0.0.1"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider -m 'not slow and not network'"
markers = ["slow: long profiles, not part of the normal run (pytest -m slow)",
           "network: read-only checks of real public sites (pytest -m network); never part of the normal run"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
