# Local:  docker compose -f deploy/docker-compose.yml up --build      -> http://localhost
# Prod:   CADDYFILE=Caddyfile.prod docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#         (APP_DOMAIN must be set in .env; ports 80/443 open on the VPS)

name: launchwitness

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    volumes:
      - app-data:/app/backend/data
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
  caddy-config:
